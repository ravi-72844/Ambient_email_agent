name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Offline tests (FakeLLM, mock Gmail - no API keys needed)
        run: pytest -q
      - name: Offline evaluation smoke run
        run: |
          python -m evals.triage_accuracy
          python -m evals.hitl_trajectory
          python -m evals.memory_adaptation
